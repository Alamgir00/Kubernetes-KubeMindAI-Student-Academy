apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-check
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: check
            image: busybox:1.36
            command: ["sh", "-c", "date; echo scheduled lab"]
